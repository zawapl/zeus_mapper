name: Bump version and tag

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type (ignored if 'version' is set)"
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      version:
        description: "Explicit version to set, e.g. 1.2.3 (overrides 'bump')"
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: release-version-bump

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Compute new version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          VERSION_OVERRIDE: ${{ inputs.version }}
        run: |
          set -euo pipefail

          CURRENT=$(grep -m1 '^version = ' zeus_mapper/Cargo.toml | sed -E 's/version = "(.*)"/\1/')

          if [ -n "$VERSION_OVERRIDE" ]; then
            NEW_VERSION="$VERSION_OVERRIDE"
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
            case "$BUMP" in
              major) NEW_VERSION="$((MAJOR + 1)).0.0" ;;
              minor) NEW_VERSION="$MAJOR.$((MINOR + 1)).0" ;;
              patch) NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))" ;;
              *)
                echo "Unknown bump type: $BUMP" >&2
                exit 1
                ;;
            esac
          fi

          if ! [[ "$NEW_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version '$NEW_VERSION' (expected X.Y.Z)" >&2
            exit 1
          fi

          if git rev-parse "v$NEW_VERSION" >/dev/null 2>&1; then
            echo "Tag v$NEW_VERSION already exists" >&2
            exit 1
          fi

          echo "Bumping $CURRENT -> $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Update Cargo.toml versions
        env:
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          set -euo pipefail
          sed -i "s/^version = \".*\"/version = \"$NEW_VERSION\"/" zeus_mapper/Cargo.toml
          sed -i "s/^version = \".*\"/version = \"$NEW_VERSION\"/" my_macros/Cargo.toml

      - name: Update Cargo.lock
        env:
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          set -euo pipefail
          cargo update -p zeus_mapper --precise "$NEW_VERSION"
          cargo update -p my_macros --precise "$NEW_VERSION"

      - name: Commit and tag
        env:
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add zeus_mapper/Cargo.toml my_macros/Cargo.toml Cargo.lock
          git commit -m "Bump version to $NEW_VERSION"
          git tag "v$NEW_VERSION"
          git push origin "HEAD:$GITHUB_REF_NAME"
          git push origin "v$NEW_VERSION"
